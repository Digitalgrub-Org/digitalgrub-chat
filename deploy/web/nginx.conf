# Static server for the Flutter web client.
#
# Runs as its own container so the Matrix stack's reverse proxy can serve the
# client at the site root while /_matrix, /_synapse/client, /health and the
# well-known route continue to reach Synapse and the push gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Flutter web is a single-page app: unknown paths are client-side routes,
    # so they must return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Entry points that keep the same filename in every release.
    #
    # These must never be cached. Flutter does not fingerprint main.dart.js, so
    # a long max-age here does not just delay a deploy, it pins each browser to
    # whichever build it happened to load first until the cache expires — the
    # server updates and every existing tab keeps running the old app.
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter\.js|flutter_service_worker\.js|version\.json|manifest\.json|main\.dart\.(js|mjs|wasm))$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Fingerprinted payloads. The service worker manifest decides when these
    # are refetched, and it is itself uncacheable above, so holding them is
    # safe and keeps the 40MB+ of engine and font data off repeat loads.
    location ~ ^/(assets|canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }


    # Fallback fonts, reverse-proxied rather than fetched by the browser.
    #
    # CanvasKit rasterises its own text, so any glyph missing from the bundled
    # font -- every emoji, and all of the Tamil -- is downloaded at runtime.
    # Left alone that request goes straight to fonts.gstatic.com, handing each
    # user's IP and referer to Google from a chat server that exists precisely
    # so conversations do not leave this machine. `fontFallbackBaseUrl` in
    # index.html points the engine here instead.
    #
    # Proxying rather than mirroring: the engine picks from the whole Noto
    # family by script, so a mirror would only cover the scripts someone
    # thought to copy and would render tofu for the rest.
    location /fonts/ {
        proxy_pass https://fonts.gstatic.com/s/;
        proxy_ssl_server_name on;
        proxy_set_header Host fonts.gstatic.com;
        # No client identity travels upstream. Google sees this server asking
        # for a font, which is all it needs to know.
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Alt-Svc;

        # Font files are immutable at a given versioned path.
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        # The engine loads these with fetch(), so it needs the CORS header even
        # though the origin matches.
        add_header Access-Control-Allow-Origin "*" always;
    }
}
