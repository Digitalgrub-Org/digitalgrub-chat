<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Maskable variant. A maskable icon is cropped to a circle of 80% of the
       canvas, which clips the accent dot in the full-bleed artwork, so the
       mark is inset to the same 66% safe zone the Android adaptive layer uses. -->
