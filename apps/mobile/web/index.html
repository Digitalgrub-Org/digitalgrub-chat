<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Digitalgrub Chat — your conversations, on your server.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFBE00">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Digitalgrub Chat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Digitalgrub Chat</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // CanvasKit draws its own text rather than using the system font, so any
    // glyph the bundled font lacks -- every emoji, and all of the Tamil -- is
    // fetched at runtime from https://fonts.gstatic.com by default. That would
    // have each user's browser announce itself to Google on a self-hosted
    // chat server, which is the opposite of the point.
    //
    // Bundling the font does not fix it: the engine still goes to gstatic for
    // fallbacks (flutter/flutter#118344). Pointing the base URL at this origin
    // does, and the reverse proxy behind /fonts/ keeps every script working
    // rather than only the ones we thought to mirror.
    window.flutterConfiguration = { fontFallbackBaseUrl: '/fonts/' };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
